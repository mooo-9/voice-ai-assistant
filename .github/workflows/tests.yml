name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # CPU-only torch first, as the README says, to skip the 2 GB CUDA build.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest

      # openwakeword ships without its feature models and fetches them on
      # first use, as core/wake_word.py does at startup. The wake-word
      # training test builds AudioFeatures directly, so fetch them up front.
      - name: Fetch the wake-word feature models
        run: python -c "import openwakeword.utils as u; u.download_models()"

      # The runner's desktop is 1024x768; the window-placement tests assume a
      # normal monitor, as the app does.
      - name: Set a 1080p screen
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider
